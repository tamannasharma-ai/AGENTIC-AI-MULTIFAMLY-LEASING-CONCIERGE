<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRD & Live App</title>
  
  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      color: #333;
      background-color: #f9f9f9;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    iframe {
      width: 100%;
      height: 750px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      background-color: #ff4b4b;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 10px;
    }
    .btn:hover {
      background-color: #d43b3b;
    }
  </style>
</head>
<body>

  <!-- PRD Container -->
  <div class="card">
    <div id="prd-content">Loading PRD...</div>
    <hr style="margin: 30px 0; border: none; border-top: 1px solid #eee;" />
    <h3>Live Application</h3>
    <p>Access the deployed Streamlit app directly or use the embedded view below:</p>
    
    <!-- UPDATE THIS URL with your deployed Streamlit Cloud app link -->
    <a href="https://your-username-repo-name.streamlit.app" target="_blank" class="btn">
      Open App in New Tab ↗
    </a>
  </div>

  <!-- Embedded Streamlit App Container -->
  <div class="card">
    <h2>Interactive App Preview</h2>
    
    <!-- UPDATE THIS URL with your deployed Streamlit Cloud app link -->
    <iframe 
      src="https://ai-agentic-multifamily-leasing-concierge.streamlit.app/" 
      title="Streamlit App">
    </iframe>
  </div>

  <script>
    // Fetch and render your PRD file automatically
    // Adjust "../PRD.md" or "../PRD" depending on your exact filename extension
    fetch('../PRD.md')
      .then(response => {
        if (!response.ok) {
          // Fallback if the file has no .md extension
          return fetch('../PRD');
        }
        return response;
      })
      .then(response => response.text())
      .then(text => {
        document.getElementById('prd-content').innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById('prd-content').innerHTML = 
          '<p style="color:red;">Failed to load PRD file. Ensure PRD or PRD.md exists in the root folder.</p>';
      });
  </script>

</body>
</html>
